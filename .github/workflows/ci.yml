name: CI

# The stages of tools/test_all.sh, one job each, so a red job reproduces
# locally with the same command.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIM_VERSION: 2.2.4

jobs:
  host:
    name: Nim API on the desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with: {nim-version: '${{ env.NIM_VERSION }}', repo-token: '${{ secrets.GITHUB_TOKEN }}'}
      - run: nimble install -y jnim
      - run: tools/test_all.sh host

  android:
    name: Robolectric + NDK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: jiro4989/setup-nim-action@v2
        with: {nim-version: '${{ env.NIM_VERSION }}', repo-token: '${{ secrets.GITHUB_TOKEN }}'}
      - run: nimble install -y jnim
      - name: Android platform 36 and NDK r28c
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: tools/test_all.sh android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/*/build/reports/tests/
            android/sample/build/outputs/apk/debug/*.apk

  rui:
    name: Druid inside RUI
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {path: druid}
      - uses: actions/checkout@v4
        with: {repository: kobi2187/rui2, path: rui2}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: jiro4989/setup-nim-action@v2
        with: {nim-version: '${{ env.NIM_VERSION }}', repo-token: '${{ secrets.GITHUB_TOKEN }}'}
      - name: RUI's dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libxkbcommon-dev \
            libpango1.0-dev libcairo2-dev libasound2-dev fonts-dejavu-core fonts-roboto
          nimble install -y jnim "naylib@>=25.42.0 & <26.0.0" "yaml@>=2.2.0" db_connector
      - name: Android platform 36 and NDK r28c
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: druid/tools/test_all.sh rui
        env: {RUI_DIR: '${{ github.workspace }}/rui2'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rui-demo
          path: |
            druid/android/rui-demo/build/reports/tests/
            druid/android/rui-demo/build/outputs/apk/debug/*.apk
